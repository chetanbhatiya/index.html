<style>
    /* =========================
       RESET
    ========================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
        padding: 30px 15px;
    }

    button,
    input,
    select {
        font: inherit;
    }

    /* =========================
       MAIN CONTAINER
    ========================== */

    .container {
        max-width: 1100px;
        margin: auto;
    }

    /* =========================
       HEADER
    ========================== */

    header {
        text-align: center;
        margin-bottom: 30px;
    }

    header h1 {
        font-size: 42px;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #6366f1, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    header p {
        color: #64748b;
        font-size: 16px;
    }

    /* =========================
       SUMMARY CARDS
    ========================== */

    .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .card {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .summary-card {
        position: relative;
        overflow: hidden;
    }

    .summary-card::after {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        right: -20px;
        top: -20px;
        background: rgba(99, 102, 241, 0.08);
    }

    .summary-card h3 {
        font-size: 15px;
        color: #64748b;
        margin-bottom: 12px;
    }

    .amount {
        font-size: 30px;
        font-weight: 700;
    }

    .balance {
        color: #6366f1;
    }

    .income {
        color: #16a34a;
    }

    .expense {
        color: #dc2626;
    }

    /* =========================
       MAIN GRID
    ========================== */

    .main-grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 25px;
    }

    .card-title {
        font-size: 20px;
        margin-bottom: 20px;
    }

    /* =========================
       FORM
    ========================== */

    .form-group {
        margin-bottom: 17px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #475569;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        outline: none;
        background: white;
        transition: 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .add-btn {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }

    /* =========================
       TRANSACTIONS
    ========================== */

    .transaction-top {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin-bottom: 20px;
    }

    .search {
        max-width: 220px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        outline: none;
    }

    .transaction-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .transaction {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 15px;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #fff;
        transition: 0.2s;
    }

    .transaction:hover {
        transform: translateX(3px);
        box-shadow: 0 5px 15px rgba(15, 23, 42, 0.06);
    }

    .transaction-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .transaction-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: #eef2ff;
        font-size: 20px;
        flex-shrink: 0;
    }

    .transaction-details {
        min-width: 0;
    }

    .transaction-details h4 {
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .transaction-details p {
        font-size: 12px;
        color: #94a3b8;
    }

    .transaction-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
    }

    .transaction-amount {
        font-weight: 700;
    }

    .income-text {
        color: #16a34a;
    }

    .expense-text {
        color: #dc2626;
    }

    .delete-btn {
        border: none;
        background: #fee2e2;
        color: #dc2626;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 16px;
    }

    .delete-btn:hover {
        background: #fecaca;
    }

    .empty {
        text-align: center;
        padding: 50px 20px;
        color: #94a3b8;
    }

    .empty-icon {
        font-size: 45px;
        margin-bottom: 10px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
        text-align: center;
        margin-top: 30px;
        color: #64748b;
        font-size: 14px;
    }

    footer a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 600;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 850px) {
        .main-grid {
            grid-template-columns: 1fr;
        }

        .summary {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 12px;
        }

        header h1 {
            font-size: 32px;
        }

        .transaction-top {
            flex-direction: column;
            align-items: stretch;
        }

        .search {
            max-width: 100%;
        }

        .transaction {
            align-items: flex-start;
        }

        .transaction-right {
            flex-direction: column;
            align-items: flex-end;
            gap: 7px;
        }
    }
</style>

```
<div class="container">

    <!-- HEADER -->
    <header>
        <h1>💰 Expense Tracker</h1>
        <p>Manage your income and expenses easily.</p>
    </header>

    <!-- SUMMARY -->
    <section class="summary">

        <div class="card summary-card">
            <h3>💳 Total Balance</h3>
            <div class="amount balance" id="balance">₹0.00</div>
        </div>

        <div class="card summary-card">
            <h3>📈 Total Income</h3>
            <div class="amount income" id="income">₹0.00</div>
        </div>

        <div class="card summary-card">
            <h3>📉 Total Expenses</h3>
            <div class="amount expense" id="expense">₹0.00</div>
        </div>

    </section>

    <!-- MAIN CONTENT -->
    <main class="main-grid">

        <!-- ADD TRANSACTION -->
        <section class="card">

            <h2 class="card-title">➕ Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Grocery, Salary"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="type">Transaction Type</label>

                    <select id="type" required>
                        <option value="expense">Expense 📉</option>
                        <option value="income">Income 📈</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category">
                        <option value="Food">🍔 Food</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Salary">💼 Salary</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <button type="submit" class="add-btn">
                    Add Transaction
                </button>

            </form>

        </section>

        <!-- TRANSACTION HISTORY -->
        <section class="card">

            <div class="transaction-top">
                <h2 class="card-title">📋 Transactions</h2>

                <input
                    type="search"
                    id="search"
                    class="search"
                    placeholder="Search..."
                >
            </div>

            <div id="transactionList" class="transaction-list">
                <!-- JavaScript transactions appear here -->
            </div>

        </section>

    </main>

    <footer>
        Built by
        <a href="https://github.com/chetanbhatiya" target="_blank">
            Chetan Bhatiya
        </a>
        🚀
    </footer>

</div>

<script>
    /* =========================
       ELEMENTS
    ========================== */

    const transactionForm = document.getElementById("transactionForm");
    const descriptionInput = document.getElementById("description");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");
    const categoryInput = document.getElementById("category");
    const transactionList = document.getElementById("transactionList");
    const searchInput = document.getElementById("search");

    const balanceElement = document.getElementById("balance");
    const incomeElement = document.getElementById("income");
    const expenseElement = document.getElementById("expense");


    /* =========================
       DATA
    ========================== */

    let transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];


    /* =========================
       SAVE DATA
    ========================== */

    function saveTransactions() {
        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );
    }


    /* =========================
       FORMAT CURRENCY
    ========================== */

    function formatCurrency(amount) {
        return new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR"
        }).format(amount);
    }


    /* =========================
       UPDATE SUMMARY
    ========================== */

    function updateSummary() {

        let income = 0;
        let expense = 0;

        transactions.forEach(transaction => {

            if (transaction.type === "income") {
                income += transaction.amount;
            } else {
                expense += transaction.amount;
            }

        });

        const balance = income - expense;

        balanceElement.textContent = formatCurrency(balance);
        incomeElement.textContent = formatCurrency(income);
        expenseElement.textContent = formatCurrency(expense);
    }


    /* =========================
       DISPLAY TRANSACTIONS
    ========================== */

    function displayTransactions(searchTerm = "") {

        transactionList.innerHTML = "";

        const filteredTransactions = transactions.filter(transaction =>
            transaction.description
                .toLowerCase()
                .includes(searchTerm.toLowerCase())
        );


        if (filteredTransactions.length === 0) {

            transactionList.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📭</div>
                    <p>No transactions found.</p>
                </div>
            `;

            return;
        }


        filteredTransactions.forEach(transaction => {

            const div = document.createElement("div");

            div.className = "transaction";

            const isIncome = transaction.type === "income";

            div.innerHTML = `

                <div class="transaction-info">

                    <div class="transaction-icon">
                        ${isIncome ? "📈" : "📉"}
                    </div>

                    <div class="transaction-details">

                        <h4>${escapeHTML(transaction.description)}</h4>

                        <p>
                            ${transaction.category}
                            • ${transaction.date}
                        </p>

                    </div>

                </div>


                <div class="transaction-right">

                    <span class="
                        transaction-amount
                        ${isIncome ? "income-text" : "expense-text"}
                    ">
                        ${isIncome ? "+" : "-"}
                        ${formatCurrency(transaction.amount)}
                    </span>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${transaction.id})"
                        aria-label="Delete transaction"
                    >
                        🗑️
                    </button>

                </div>
            `;

            transactionList.appendChild(div);

        });
    }


    /* =========================
       ADD TRANSACTION
    ========================== */

    transactionForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const description = descriptionInput.value.trim();
        const amount = Number(amountInput.value);
        const type = typeInput.value;
        const category = categoryInput.value;


        if (!description || amount <= 0) {
            alert("Please enter valid transaction details.");
            return;
        }


        const transaction = {

            id: Date.now(),

            description: description,

            amount: amount,

            type: type,

            category: category,

            date: new Date().toLocaleDateString("en-IN")
        };


        transactions.unshift(transaction);

        saveTransactions();

        updateSummary();

        displayTransactions();

        transactionForm.reset();

    });


    /* =========================
       DELETE TRANSACTION
    ========================== */

    function deleteTransaction(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this transaction?"
        );

        if (!confirmed) {
            return;
        }

        transactions = transactions.filter(
            transaction => transaction.id !== id
        );

        saveTransactions();

        updateSummary();

        displayTransactions(searchInput.value);
    }


    /* =========================
       SEARCH
    ========================== */

    searchInput.addEventListener("input", function() {

        displayTransactions(searchInput.value);

    });


    /* =========================
       HTML ESCAPE
    ========================== */

    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    /* =========================
       INITIAL LOAD
    ========================== */

    updateSummary();

    displayTransactions();

</script>
